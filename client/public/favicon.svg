<!--
  The app mark as a favicon: the same two overlapping normal distributions as
  client/src/shared/ui/Logo.tsx, with the palette written out literally.

  The Cartographer logo is a trademark, which the AGPL does not license. A fork
  that is shared or hosted replaces this file and Logo.tsx; see TRADEMARKS.md.

  Written out on purpose. A favicon is rendered in isolation by the browser
  chrome, so the CSS custom properties the component uses resolve to nothing
  here and the mark would come out invisible. These hex values are the logo
  tokens from client/src/styles/tokens.css; if those change, change these too.
  It lives under public/ rather than src/, which is also why it does not trip
  the "no raw hex outside tokens.css" grep: that invariant is about styling the
  app, and this is not the app.

  Careful editing this comment: a double hyphen is illegal inside XML, and an
  SVG that is not well formed does not fail loudly — it simply never decodes,
  and the tab falls back to a blank page icon. Naming the tokens with their
  leading dashes here is exactly what broke it the first time.

  No dark variant: the logo tokens have no dark-theme override, so one pair of
  colours serves both, and this deep blue holds up on a light or dark tab strip.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <title>Cartographer</title>
  <!-- Back curve: deep indigo (μ 12 / σ 5.4). -->
  <path
    fill="#1B4E8F"
    d="M 1 25 L 1 23.05 L 1.62 22.55 L 2.25 21.96 L 2.88 21.28 L 3.5 20.51 L 4.12 19.65 L 4.75 18.71 L 5.38 17.7 L 6 16.64 L 6.62 15.56 L 7.25 14.47 L 7.88 13.42 L 8.5 12.44 L 9.12 11.55 L 9.75 10.79 L 10.38 10.19 L 11 9.76 L 11.62 9.54 L 12.25 9.52 L 12.88 9.7 L 13.5 10.09 L 14.12 10.65 L 14.75 11.39 L 15.38 12.25 L 16 13.22 L 16.62 14.26 L 17.25 15.34 L 17.88 16.42 L 18.5 17.49 L 19.12 18.51 L 19.75 19.47 L 20.38 20.34 L 21 21.14 L 21.62 21.83 L 22.25 22.44 L 22.88 22.96 L 23.5 23.39 L 24.12 23.75 L 24.75 24.05 L 25.38 24.28 L 26 24.46 L 26.62 24.6 L 27.25 24.71 L 27.88 24.79 L 28.5 24.85 L 29.12 24.9 L 29.75 24.93 L 30.38 24.95 L 31 24.97 L 31 25 Z"
  />
  <!-- Front curve: the interaction blue (μ 19 / σ 4.6), laid over it at 0.86 so
       the overlap reads as a third, darker band. -->
  <path
    fill="#35B8E0"
    fill-opacity="0.86"
    d="M 1 25 L 1 24.99 L 1.62 24.98 L 2.25 24.97 L 2.88 24.96 L 3.5 24.93 L 4.12 24.9 L 4.75 24.84 L 5.38 24.76 L 6 24.64 L 6.62 24.48 L 7.25 24.25 L 7.88 23.95 L 8.5 23.56 L 9.12 23.05 L 9.75 22.42 L 10.38 21.64 L 11 20.7 L 11.62 19.61 L 12.25 18.36 L 12.88 16.96 L 13.5 15.46 L 14.12 13.88 L 14.75 12.27 L 15.38 10.71 L 16 9.24 L 16.62 7.93 L 17.25 6.86 L 17.88 6.07 L 18.5 5.61 L 19.12 5.51 L 19.75 5.76 L 20.38 6.35 L 21 7.26 L 21.62 8.43 L 22.25 9.81 L 22.88 11.32 L 23.5 12.92 L 24.12 14.52 L 24.75 16.07 L 25.38 17.54 L 26 18.87 L 26.62 20.06 L 27.25 21.1 L 27.88 21.97 L 28.5 22.69 L 29.12 23.27 L 29.75 23.73 L 30.38 24.08 L 31 24.35 L 31 25 Z"
  />
  <line x1="1" y1="25.5" x2="31" y2="25.5" stroke="#1B4E8F" stroke-opacity="0.28" stroke-width="1.4" stroke-linecap="round" />
</svg>
